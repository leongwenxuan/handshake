<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Handshake</title>
    <style>
      :root {
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        --bg: #232323;
        --surface: #2e2e2e;
        --line: #3d3d3d;
        --text: #e5e5e5;
        --muted: #a3a3a3;
        --accent: #7fe0a0;
        --error: #ff8a80;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; }
      h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 24px 0 8px; font-weight: 600; }
      p { margin: 0; }
      .sub { color: var(--muted); margin-top: 4px; }
      form { margin-top: 20px; display: grid; gap: 8px; }
      label { font-size: 13px; color: var(--muted); }
      .row { display: flex; gap: 8px; }
      input {
        flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--surface);
        border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      button {
        font: inherit; font-weight: 600; color: #111; background: var(--accent);
        border: 0; border-radius: 10px; padding: 0 18px; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 12px; min-height: 1.45em; color: var(--muted); }
      #status.error { color: var(--error); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
      .company { margin-top: 24px; }
      .company .name { font-size: 18px; font-weight: 650; }
      .company .domain { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
      .company .one { margin-top: 4px; }
      dl { margin: 12px 0 0; display: grid; gap: 8px; }
      dt { font-size: 12px; color: var(--muted); }
      dd { margin: 0; }
      .buyers { display: grid; gap: 8px; }
      .buyer .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .buyer .role { font-weight: 650; }
      .kind { font-size: 12px; color: var(--accent); white-space: nowrap; }
      .buyer .why { margin-top: 4px; }
      .buyer .titles { margin-top: 6px; color: var(--muted); font-size: 13px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
      ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
      .summary { color: var(--muted); margin-bottom: 10px; }
      .leads { display: grid; gap: 8px; }
      .lead { border-left: 3px solid var(--line); }
      .lead.fit-strong { border-left-color: var(--accent); }
      .lead.fit-maybe { border-left-color: #e0c97f; }
      .lead .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .lead .who { font-weight: 650; }
      .lead .at { color: var(--muted); margin-left: 6px; }
      .badge { font-size: 12px; white-space: nowrap; color: var(--muted); }
      .fit-strong .badge { color: var(--accent); }
      .fit-maybe .badge { color: #e0c97f; }
      .lead .facts { margin-top: 4px; font-size: 13px; color: var(--muted); }
      .lead .facts .ok { color: var(--text); }
      .lead .why { margin-top: 6px; }
      .lead .ask { margin-top: 6px; color: var(--accent); }
      .lead .time { margin-top: 8px; font-size: 12px; color: var(--muted); }
      details { margin-top: 10px; }
      summary { cursor: pointer; color: var(--muted); font-size: 13px; }
      .subject { margin-top: 8px; font-weight: 600; }
      pre { margin: 6px 0 0; white-space: pre-wrap; font: inherit; overflow-wrap: anywhere; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .actions button, .btn {
        font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px;
        color: var(--text); background: transparent; border: 1px solid var(--line); text-decoration: none;
      }
      .foot { margin-top: 24px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Handshake</h1>
      <p class="sub">Tell it what you sell. It works out who to talk to, then checks everyone you meet against that.</p>

      <form id="setup">
        <label for="company">Your company</label>
        <div class="row">
          <input id="company" placeholder="yourcompany.com" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button id="build" type="submit">Build</button>
        </div>
        <input id="note" placeholder="Optional focus, e.g. Southeast Asia, mid-market" autocomplete="off" />
      </form>
      <p id="status" role="status"></p>

      <section id="leads" hidden></section>
      <section id="profile" hidden></section>
    </main>
    <script type="module" src="/src/phone.ts"></script>
    <script type="module" src="/src/recap.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
